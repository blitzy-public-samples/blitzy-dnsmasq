# =============================================================================
# Test fixture: dnsmasq.conf
# =============================================================================
# This configuration file is a test fixture consumed by integration tests in
# tests/integration/config_parsing.rs (specifically test_parse_fixture_config()).
#
# Unlike the fully-commented dnsmasq.conf.example, ALL directives here are
# UNCOMMENTED (active) so the Rust config parser must parse every one of them.
#
# This file contains representative directives from ALL major configuration
# categories: DNS, DHCP, DHCPv6, DNSSEC, TFTP, logging, records, and security.
#
# Default reference values from config.h:
#   CACHESIZ=150, MAXLEASES=1000, FTABSIZ=150
#   NAMESERVER_PORT=53, EDNS_PKTSZ=1232, TIMEOUT=10
# =============================================================================

# -----------------------------------------------------------------------------
# DNS Server Configuration
# -----------------------------------------------------------------------------

# Use a non-standard DNS port (default is 53 / NAMESERVER_PORT)
port=5353

# Never forward plain names (without a dot or domain part)
domain-needed

# Never forward addresses in the non-routed address spaces
bogus-priv

# Do not read /etc/resolv.conf for upstream servers
no-resolv

# Upstream DNS servers (simple address form)
server=8.8.8.8
server=8.8.4.4

# Domain-specific forwarding: send queries for example.local to 10.0.0.1
server=/example.local/10.0.0.1

# PTR query routing: reverse lookups for 192.168.3.x go to 10.0.0.1
server=/3.168.192.in-addr.arpa/10.0.0.1

# DNS-level address override: blocked.example.com always returns 127.0.0.1
address=/blocked.example.com/127.0.0.1

# Local-only domain: queries for local.lan answered from /etc/hosts or DHCP only
local=/local.lan/

# Override default cache size (CACHESIZ=150) with 500 entries
cache-size=500

# Disable negative caching
no-negcache

# Set TTL for answers from /etc/hosts and DHCP lease file
local-ttl=300

# ISP hijack detection: treat responses containing 1.2.3.4 as NXDOMAIN
bogus-nxdomain=1.2.3.4

# Log each DNS query as it passes through dnsmasq
log-queries

# Expand simple hostnames by appending the domain
expand-hosts

# -----------------------------------------------------------------------------
# Network Interface Configuration
# -----------------------------------------------------------------------------

# Bind to specific addresses (IPv4 and IPv6 loopback)
listen-address=127.0.0.1
listen-address=::1

# Bind only to the interfaces on which we are listening
bind-interfaces

# Exclude the docker0 interface from listening
except-interface=docker0

# -----------------------------------------------------------------------------
# DHCP Configuration (feature = "dhcp")
# -----------------------------------------------------------------------------

# DHCPv4 range with explicit netmask and 12-hour lease time
dhcp-range=192.168.1.100,192.168.1.200,255.255.255.0,12h

# Tagged DHCP range for the "testnet" network tag
dhcp-range=set:testnet,10.0.0.50,10.0.0.150

# Static DHCP reservation: MAC -> IP, hostname, infinite lease
dhcp-host=00:11:22:33:44:55,192.168.1.50,testhost,infinite

# Simple MAC-to-IP static mapping
dhcp-host=00:11:22:33:44:66,192.168.1.51

# DHCP options using named option format
dhcp-option=option:router,192.168.1.1
dhcp-option=option:dns-server,192.168.1.1,8.8.8.8
dhcp-option=option:domain-name,test.local
dhcp-option=option:ntp-server,192.168.1.1

# DHCP option using numeric format (option 3 = router)
dhcp-option=3,192.168.1.1

# Override default max leases (MAXLEASES=1000) with 500
dhcp-lease-max=500

# Enable authoritative DHCP mode
dhcp-authoritative

# Set lease file location
dhcp-leasefile=/tmp/dnsmasq-test.leases

# Script executed on DHCP lease changes (add/del)
dhcp-script=/bin/echo

# Read /etc/ethers for MAC-to-IP mappings
read-ethers

# -----------------------------------------------------------------------------
# DHCPv6 Configuration (feature = "dhcp6")
# -----------------------------------------------------------------------------

# DHCPv6 address range with /64 prefix and 24-hour lease time
dhcp-range=1234::100,1234::200,64,24h

# Router Advertisements only — no DHCPv6 address allocation
dhcp-range=1234::,ra-only

# Enable Router Advertisements for all DHCPv6 subnets
enable-ra

# -----------------------------------------------------------------------------
# DNSSEC Configuration (feature = "dnssec")
# -----------------------------------------------------------------------------

# Enable DNSSEC validation
dnssec

# Root trust anchor: key tag 20326, algorithm 8 (RSA/SHA-256),
# digest type 2 (SHA-256), followed by the hex digest
trust-anchor=.,20326,8,2,E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D

# Verify that unsigned DNS replies are legitimate
dnssec-check-unsigned

# -----------------------------------------------------------------------------
# TFTP Configuration (feature = "tftp")
# -----------------------------------------------------------------------------

# Enable the built-in read-only TFTP server
enable-tftp

# Root directory for TFTP file serving
tftp-root=/var/ftpd

# Only serve files owned by the dnsmasq user
tftp-secure

# Disable TFTP blocksize negotiation (compatibility with broken clients)
tftp-no-blocksize

# -----------------------------------------------------------------------------
# Domain and Hostname Configuration
# -----------------------------------------------------------------------------

# Set the local domain name
domain=test.local

# Subnet-specific domain: 192.168.2.0/24 uses wireless.test.local
domain=wireless.test.local,192.168.2.0/24

# -----------------------------------------------------------------------------
# DNS Record Directives
# -----------------------------------------------------------------------------

# MX record: test.local mail handled by mail.test.local, preference 10
mx-host=test.local,mail.test.local,10

# SRV record: LDAP service at ldap.test.local port 389, priority 1
srv-host=_ldap._tcp.test.local,ldap.test.local,389,1

# TXT record: SPF policy for test.local
txt-record=test.local,"v=spf1 a -all"

# PTR record for DNS-SD service discovery
ptr-record=_http._tcp.local,"Test Web Server._http._tcp.local"

# CNAME alias: www is an alias for webserver
cname=www,webserver

# -----------------------------------------------------------------------------
# Logging and Debug
# -----------------------------------------------------------------------------

# Log DHCP transactions with extra detail
log-dhcp

# In production you would include additional config files:
# conf-file=/etc/dnsmasq.d/local.conf
# conf-dir=/etc/dnsmasq.d/,*.conf

# -----------------------------------------------------------------------------
# User/Group and Security
# -----------------------------------------------------------------------------

# Run the daemon as an unprivileged user and group
user=nobody
group=nogroup
