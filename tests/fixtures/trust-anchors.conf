# Test fixture: DNSSEC root trust anchors
# This file is a test copy of the production trust-anchors.conf at repository root.
# It is consumed by tests/integration/dnssec_validation.rs (test_trust_anchor_loading).
#
# Format: trust-anchor=<zone>,<keytag>,<algorithm>,<digest-type>,<hex-digest>
#   zone        = "." (root zone)
#   keytag      = numeric key tag identifier
#   algorithm   = 8 (RSA/SHA-256, per DNSSEC algorithm registry)
#   digest-type = 2 (SHA-256, per DS digest type registry)
#   hex-digest  = 64-character hexadecimal SHA-256 hash of the root KSK

# The root DNSSEC trust anchor, valid as at 18/07/2024
# Note that this is a DS record (i.e. a hash of the root Zone Signing Key)
# It was downloaded from https://data.iana.org/root-anchors/root-anchors.xml

# Key tag 20326: Current root KSK trust anchor, active since 2018 (KSK-2017)
trust-anchor=.,20326,8,2,E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D
# Key tag 38696: Future root KSK trust anchor, pre-published for key rollover (KSK-2024)
trust-anchor=.,38696,8,2,683D2D0ACB8C9B712A1948B27F741219298D0A450D612C483AF444A4C0FB2B16
