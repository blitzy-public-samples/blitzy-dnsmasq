# Cargo configuration for dnsmasq cross-compilation
# Supports building for x86-64 and ARM64 Linux targets
# See: https://doc.rust-lang.org/cargo/reference/config.html

# ARM64 (aarch64) cross-compilation requires the aarch64-linux-gnu-gcc
# cross-compiler toolchain. Install via:
#   apt install gcc-aarch64-linux-gnu
# Then build with:
#   cargo build --target aarch64-unknown-linux-gnu --release
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
