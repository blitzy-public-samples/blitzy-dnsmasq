# =============================================================================
# GitHub Actions CI/CD Workflow — Rust dnsmasq
# =============================================================================
#
# Primary CI pipeline for the Rust implementation of dnsmasq. Validates the
# C-to-Rust migration by building, testing, linting, auditing, and measuring
# code coverage across multiple feature flag combinations.
#
# Job dependency graph:
#   fmt ───────┐
#   clippy ────┤
#   build ─────┼──> test ──> coverage
#   audit ─────┘
#
# Feature flag matrix tested:
#   - default: dhcp, dhcp6, tftp, script, auth, ipset, loop-detect, dumpfile,
#              inotify
#   - all-features: default + dnssec, dbus, ubus, idn, conntrack, nftset,
#                   luascript
#   - no-default-features: minimal build to validate #[cfg(feature)] guards
#
# System dependencies required for optional features (all-features builds):
#   - libdbus-1-dev: D-Bus integration (dbus feature)
#   - libnettle-dev + libgmp-dev: DNSSEC cryptography (dnssec feature)
#   - liblua5.4-dev: Lua scripting (luascript feature)
#   - libnftnl-dev: nftables sets (nftset feature)
#   - libmnl-dev: Netlink operations
#   - libclang-dev: FFI bindgen for nettle-sys
#   - pkg-config: System library detection
#
# Coordination files:
#   - rust/Cargo.toml: Dependency and feature flag declarations
#   - rust/rust-toolchain.toml: Rust 1.91.0 stable toolchain pin
#   - rust/clippy.toml: Clippy lint configuration
#   - rust/rustfmt.toml: Code formatting rules
#   - rust/audit.toml: cargo-audit vulnerability scanning config
# =============================================================================

name: Rust CI

on:
  push:
    branches: [main, master]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'

# Cancel in-progress runs for the same branch or pull request to conserve
# runner resources and avoid stale results.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Enable colored Cargo output in CI logs for readability.
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Format Check — Enforces consistent code formatting via rustfmt
  # ---------------------------------------------------------------------------
  # Fastest job with no compilation required. Fails if any Rust source file
  # does not conform to the formatting rules defined in rust/rustfmt.toml.
  # No system dependencies needed since formatting is syntax-level only.
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # ---------------------------------------------------------------------------
  # Clippy Lint — Static analysis with project-specific lint rules
  # ---------------------------------------------------------------------------
  # Runs cargo clippy with warnings treated as errors (-D warnings) against
  # both default features and all-features configurations to catch lint
  # violations across all conditional compilation paths. Lint rules are
  # defined in rust/clippy.toml and automatically picked up by clippy.
  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      # System libraries required for all-features clippy analysis. Clippy
      # compiles the code for analysis, so FFI crate dependencies must be
      # present for the dnssec, dbus, nftset, and luascript features.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libnettle-dev \
            libgmp-dev \
            liblua5.4-dev \
            libmnl-dev \
            libnftnl-dev \
            libclang-dev

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # Build — Compile across feature flag combinations and platforms
  # ---------------------------------------------------------------------------
  # Validates conditional compilation correctness (#[cfg(feature = "...")])
  # by building with three feature flag combinations on Linux, plus a
  # default-features build on macOS for cross-platform validation.
  #
  # Feature combinations map to C HAVE_* macro groups (see src/config.h):
  #   default     — HAVE_DHCP, HAVE_DHCP6, HAVE_TFTP, HAVE_SCRIPT, HAVE_AUTH,
  #                 HAVE_IPSET, HAVE_LOOP, HAVE_DUMPFILE, HAVE_INOTIFY
  #   all-features — all of the above + HAVE_DNSSEC, HAVE_DBUS, HAVE_UBUS,
  #                  HAVE_IDN, HAVE_CONNTRACK, HAVE_NFTSET, HAVE_LUASCRIPT
  #   no-default  — minimal DNS-only build (no optional features)
  build:
    name: Build (${{ matrix.features.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        features:
          - name: default
            args: ""
          - name: all-features
            args: "--all-features"
          - name: no-default-features
            args: "--no-default-features"
        include:
          # Cross-platform validation: macOS with default features only.
          # BSD-specific code paths (bpf.rs, tables.rs) are compiled here.
          - os: macos-latest
            features:
              name: default
              args: ""
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      # System libraries needed for optional feature crate compilation on Linux.
      # macOS builds use default features only and do not require these packages.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libnettle-dev \
            libgmp-dev \
            liblua5.4-dev \
            libmnl-dev \
            libnftnl-dev \
            libclang-dev

      - name: Build
        run: cargo build ${{ matrix.features.args }}

  # ---------------------------------------------------------------------------
  # Test — Run unit, integration, and property-based tests
  # ---------------------------------------------------------------------------
  # Executes the full test suite across feature flag combinations:
  #   - Unit tests co-located with source modules (src/**/tests.rs)
  #   - Integration tests (tests/*.rs) for end-to-end protocol compliance
  #   - Property-based tests via proptest for DNS/DHCP protocol correctness
  #
  # Tests run after build to avoid redundant compilation on build failures.
  test:
    name: Test (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        features:
          - name: default
            args: ""
          - name: all-features
            args: "--all-features"
          - name: no-default-features
            args: "--no-default-features"
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libnettle-dev \
            libgmp-dev \
            liblua5.4-dev \
            libmnl-dev \
            libnftnl-dev \
            libclang-dev

      - name: Run tests
        run: cargo test ${{ matrix.features.args }} -- --nocapture

  # ---------------------------------------------------------------------------
  # Security Audit — Dependency vulnerability scanning
  # ---------------------------------------------------------------------------
  # Scans the dependency tree for known security vulnerabilities using
  # cargo-audit v0.22.1. Configuration in rust/audit.toml enforces the
  # zero-vulnerability target: no known advisories in any direct or
  # transitive dependency. Runs independently of build/test jobs since it
  # only inspects Cargo.lock metadata.
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.1

      - name: Run security audit
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Code Coverage — Measure test coverage with cargo-tarpaulin
  # ---------------------------------------------------------------------------
  # Runs cargo-tarpaulin v0.35.1 with all features enabled to measure code
  # coverage across the entire codebase. Coverage target: >80% as specified
  # in project requirements (AAP Section 0.7.1).
  #
  # Output: Cobertura XML report uploaded as a build artifact for integration
  # with coverage visualization services.
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libnettle-dev \
            libgmp-dev \
            liblua5.4-dev \
            libmnl-dev \
            libnftnl-dev \
            libclang-dev

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --version 0.35.1

      - name: Run coverage
        run: cargo tarpaulin --all-features --out xml --output-dir coverage/

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: rust/coverage/
          retention-days: 14
